name = "supplaiguard-playground"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Production values. Secrets (GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY) are NOT set here: use `wrangler secret put`.
[vars]
ALLOWED_ORIGIN = "https://fabr1ce.github.io"
GITHUB_OWNER = "Fabr1ce"
GITHUB_REPO = "supplaiguard"
WORKFLOW_FILE = "demo-triage.yml"
WORKFLOW_REF = "main"
# Kill switch: set to "false" in the dashboard (Settings > Variables) to stop launches without a deploy.
LAUNCH_ENABLED = "true"
DAILY_CAP = "30"
PER_CLIENT_LAUNCHES_PER_HOUR = "3"
# Remediation (draft PR) from the Playground. OFF unless exactly "true". Needs KIRO_API_KEY in the repo and
# "Allow GitHub Actions to create pull requests"; see the README. Tighter limits than normal launches.
PROPOSE_FIX_ENABLED = "false"
PROPOSE_FIX_DAILY_CAP = "3"
PROPOSE_FIX_PER_CLIENT_PER_DAY = "1"
# Scan a public GitHub repository by URL from the Playground. OFF unless exactly "true". No secrets needed beyond
# the existing GitHub App; see the README "Scan By URL Flag". Tighter limits than normal launches.
SCAN_URL_ENABLED = "false"
SCAN_URL_DAILY_CAP = "5"
SCAN_URL_PER_CLIENT_PER_DAY = "1"
SCAN_URL_WORKFLOW_FILE = "scan-repo.yml"

# Private demo: a workflow in a separate PRIVATE repository, run through its own Actions. Empty repo means NOT
# connected (launches are refused and /api/health reports privateDemoAvailable: false). See the README "Private Demo".
PRIVATE_DEMO_REPO = "Fabr1ce/ledgerlight"
PRIVATE_DEMO_WORKFLOW_FILE = "dependency-check.yml"
PRIVATE_DEMO_REF = "main"
PRIVATE_DEMO_ID = "ledgerlight"
PRIVATE_DEMO_DAILY_CAP = "6"
PRIVATE_DEMO_PER_CLIENT_PER_DAY = "2"
PRIVATE_DEMO_FIX_ENABLED = "true"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

# Local development: `npm run dev` (uses --env dev). Keep a separate .dev.vars for dev secrets.
[env.dev]
name = "supplaiguard-playground-dev"
[env.dev.vars]
ALLOWED_ORIGIN = "http://localhost:5173"
GITHUB_OWNER = "Fabr1ce"
GITHUB_REPO = "supplaiguard"
WORKFLOW_FILE = "demo-triage.yml"
WORKFLOW_REF = "main"
LAUNCH_ENABLED = "true"
DAILY_CAP = "10"
PER_CLIENT_LAUNCHES_PER_HOUR = "3"
PROPOSE_FIX_ENABLED = "false"
PROPOSE_FIX_DAILY_CAP = "3"
PROPOSE_FIX_PER_CLIENT_PER_DAY = "1"
SCAN_URL_ENABLED = "false"
SCAN_URL_DAILY_CAP = "5"
SCAN_URL_PER_CLIENT_PER_DAY = "1"
SCAN_URL_WORKFLOW_FILE = "scan-repo.yml"
PRIVATE_DEMO_WORKFLOW_FILE = "dependency-check.yml"
PRIVATE_DEMO_REF = "main"
PRIVATE_DEMO_ID = "ledgerlight"
PRIVATE_DEMO_DAILY_CAP = "6"
PRIVATE_DEMO_PER_CLIENT_PER_DAY = "2"
[[env.dev.durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"
[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]
