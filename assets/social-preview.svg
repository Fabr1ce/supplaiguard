</g></g></g><text x="655" y="300" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#e8e4f0">Suppl<tspan fill="#ff9f43">AI</tspan>Guard</text><text x="658" y="340" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="18" fill="#9a93ad">Secure locally. Verify continuously. Ship confidently.</text><text x="658" y="366" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="14" fill="#c9c3dc">Discover → Analyze → Remediate → Verify → Learn → back to Discover</text></svg>
